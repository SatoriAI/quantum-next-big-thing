[project]

name = "dss"
version = "0.1.0"
description = "Live demos and learning notebooks for the talk Quantum computing: next big thing?"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "pennylane>=0.45.1",
    "pennylane-qiskit>=0.45.0",
    "python-dotenv>=1.2.4",
    "qiskit-ibm-runtime>=0.45.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
build-constraint-dependencies = ["setuptools<81"]
